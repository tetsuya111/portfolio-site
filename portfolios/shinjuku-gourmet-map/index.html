<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="新宿のおすすめのお店を、ジャンルを切り替えながら Google マップで探せるマップ" />
    <title>新宿グルメマップ</title>
  </head>
  <body>
    <div class="layout">
      <header class="site-header">
        <h1 class="site-header__title">新宿グルメマップ</h1>
        <p class="site-header__lead">
          ジャンルを選ぶと、<span id="area-name">新宿</span>のお店が地図に表示されます。ピンを押すと詳細が見られます。
        </p>
      </header>
      <nav id="genres" class="genre-bar" aria-label="ジャンル"></nav>
      <div id="status" class="status"></div>
      <main class="content">
        <div id="map" class="map" aria-label="地図"></div>
        <aside id="detail" class="shop-detail" hidden></aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
