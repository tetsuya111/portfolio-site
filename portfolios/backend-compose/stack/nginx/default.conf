# backend-compose が services.json から生成したファイル。直接編集せず、add_backend.py で登録してください。
server {
    listen 80;
    server_name free-junk-porn.site;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name free-junk-porn.site;
    ssl_certificate /etc/letsencrypt/live/free-junk-porn.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/free-junk-porn.site/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/media-feed(?:/|$) {
        set $upstream_media_feed http://media-feed:8000;
        rewrite ^/media-feed/?(.*)$ /$1 break;
        proxy_pass $upstream_media_feed;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /media-feed;
    }

    location ~ ^/spotify-billboard-playlist(?:/|$) {
        set $upstream_spotify_billboard_playlist http://spotify-billboard-playlist:8000;
        rewrite ^/spotify-billboard-playlist/?(.*)$ /$1 break;
        proxy_pass $upstream_spotify_billboard_playlist;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /spotify-billboard-playlist;
    }

    location ~ ^/task-box-it-develop(?:/|$) {
        set $upstream_task_box_it_develop http://task-box-it-develop:8000;
        rewrite ^/task-box-it-develop/?(.*)$ /$1 break;
        proxy_pass $upstream_task_box_it_develop;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /task-box-it-develop;
    }

    location / {
        return 404;
    }
}
