# backend-compose が services.json から生成したファイル。直接編集せず、add_backend.py で登録してください。
services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot:/var/www/certbot:ro
    command: ["/bin/sh", "-c", "while :; do sleep 21600; nginx -s reload; done & exec nginx -g 'daemon off;'"]
  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
  media-feed:
    build: ./services/media-feed
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - path: ./services/media-feed/.env
        required: false
  spotify-billboard-playlist:
    build: ./services/spotify-billboard-playlist
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - path: ./services/spotify-billboard-playlist/.env
        required: false
  task-box-it-develop:
    build: ./services/task-box-it-develop
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - path: ./services/task-box-it-develop/.env
        required: false
