AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ポートフォリオサイト（portfolio-site/）の配信基盤と CI。
  S3（非公開）+ CloudFront（OAC）+ ACM + Route 53 + CodeBuild（GitHub Webhook。PR はテスト用、push はデプロイ用）。
  CloudFront で使う ACM 証明書は us-east-1 にしか作れないため、このスタックは us-east-1 にデプロイする。
  本番と dev は、このテンプレートからパラメーターを変えて別スタックとして作る（dev は DomainName・SiteBucketName・DeployBranch を本番と別にする）。

Parameters:
  DomainName:
    Type: String
    Description: >-
      サイトのドメイン名（例 portfolio.example.com、dev は dev.portfolio.example.com）。HostedZoneId のゾーン内の名前にする。
      EnableCloudFront=false のときだけ空にできる
    AllowedPattern: "^$|^(?!-)[a-z0-9-]+(\\.[a-z0-9-]+)+$"
  HostedZoneId:
    Type: String
    Description: DomainName を管理している作成済みの Route 53 ホストゾーンの ID。EnableCloudFront=false のときだけ空にできる
    AllowedPattern: "^$|^Z[A-Z0-9]+$"
  EnableCloudFront:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      CloudFront（+ ACM 証明書・Route 53・ディレクトリ補完の Function）で配信するか。
      false なら S3 へのアップロードだけを行い、ブラウザでは確認できない（キャッシュ無効化も行わない）
  SiteBucketName:
    Type: String
    Default: ""
    Description: >-
      サイトのファイルを置く S3 バケットの名前。未指定（空）なら CloudFormation が自動で付ける。
      作成済みのスタックで変えるとバケットが作り直される（旧バケットは DeletionPolicy: Retain で残る）。
      英小文字・数字・- のみ（ドット不可）
    # ドットを含む名前は HTTPS の仮想ホスト形式で証明書が合わないため受け付けない
    AllowedPattern: "^$|^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
  BackendDomainName:
    Type: String
    Default: ""
    Description: >-
      バックエンドを動かす VPS のドメイン名（例 vps.example.com。https で待ち受けていること）。
      指定すると、サイトの /apps/spotify-billboard-playlist/api/* と /auth/* をキャッシュせずに https://<この名前>/spotify-billboard-playlist/... へ転送する
      （ブラウザからはサイトと同一オリジンに見せ、Cookie と CSRF の確認をそのまま使うため）。未指定（空）なら転送しない。EnableCloudFront=false なら使わない
    AllowedPattern: "^$|^(?!-)[a-z0-9-]+(\\.[a-z0-9-]+)+$"
  DeployPath:
    Type: String
    Default: ""
    Description: >-
      バケット内のアップロード先のパス（例 preview）。CloudFront はこのパスをドメイン直下として配信する。
      先頭・末尾に / を付けない。未指定（空）ならバケット直下
    AllowedPattern: "^$|^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$"
    ConstraintDescription: 英数字・. _ - を / で区切ったパス（先頭・末尾の /、空のセグメント、. で始まるセグメントは不可）
  EnablePrTests:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      プルリクエストのテスト用 CodeBuild（<スタック名>-test）を作るか。
      dev のスタックでは false にして、本番スタックと同じ PR のテストが二重に走らないようにする
  GitHubRepoUrl:
    Type: String
    Description: GitHub リポジトリの HTTPS URL（例 https://github.com/owner/repo.git）。CodeBuild に GitHub の認証情報を事前登録しておく
    AllowedPattern: "^https://github\\.com/[^/]+/[^/]+$"
  DeployBranch:
    Type: String
    Default: ""
    Description: >-
      push されたときに本番へデプロイするブランチ。未指定（空）なら任意のブランチへの push でデプロイする。
      プルリクエストのテスト（<スタック名>-test）も、このブランチを向き先とする PR だけで実行する（未指定なら任意のブランチ向け）
  GitHubActorAccountId:
    Type: String
    Description: >-
      プルリクエストのビルドを許可する GitHub アカウントの数値 ID（`gh api users/<ユーザー名> -q .id` で確認）。
      公開リポジトリのため、これ以外のアカウント（fork からの第三者）の PR ではビルドしない
    AllowedPattern: "^[0-9]+$"
  BudgetAlertEmail:
    Type: String
    Description: 月額料金のアラートを受け取るメールアドレス（AWS Budgets から確認メールは届かず、そのまま通知される）
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  MonthlyBudgetUsd:
    Type: Number
    Default: 10
    MinValue: 1
    Description: 月額料金の予算（USD）。実績が 80% を超えたとき、または予測が 100% を超えたときにメールで通知する
  EnableWaf:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      CloudFront に AWS WAF（IP ごとのレート制限）を付けるか。付けると Web ACL とルールの月額固定費がかかる
      （料金の歯止めは BudgetAlertEmail の通知が基本）
  ItArticlesScheduleExpression:
    Type: String
    Default: rate(1 day)
    Description: >-
      IT 記事の定期作成（<スタック名>-it-articles）を実行する間隔。EventBridge Scheduler の rate(...) か cron(...)。
      cron のタイムゾーンは Asia/Tokyo（例 cron(0 6 * * ? *) で毎日 6:00）
    AllowedPattern: "^(rate|cron)\\(.+\\)$"
  ItArticlesScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: ["ENABLED", "DISABLED"]
    Description: >-
      IT 記事の定期作成の ON（ENABLED）/ OFF（DISABLED）。PerplexityApiKeyParameterName の SSM パラメーターを作ってから ENABLED にする
  ItArticlesPerRun:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 10
    Description: 1回の定期作成で作る IT 記事の数（出典が既存の記事と重なる題材は除くため、これより少なくなることがある）
  SecurityArticlesPerRun:
    Type: Number
    Default: 3
    MinValue: 0
    MaxValue: 10
    Description: >-
      1回の定期作成（<スタック名>-it-articles）で、IT 記事に続けて作るセキュリティ記事の数。0 で作らない
      （出典が既存の記事と重なる題材は除くため、これより少なくなることがある）
  PerplexityModel:
    Type: String
    Default: sonar
    AllowedValues: ["sonar", "sonar-pro"]
    Description: IT 記事の作成に使う Perplexity のモデル（sonar-pro は高品質だが料金が高い）
  PerplexityApiKeyParameterName:
    Type: String
    Default: /portfolio-site/perplexity-api-key
    Description: >-
      Perplexity の API キーを入れた SSM パラメーター（SecureString、既定の aws/ssm キーで暗号化）の名前。
      テンプレートの外で手動で作る（キーをテンプレート・パラメーターファイルに書かないため）
    AllowedPattern: "^/[A-Za-z0-9_.\\-/]+$"

Conditions:
  UseCloudFront: !Equals [!Ref EnableCloudFront, "true"]
  # CloudFront を作らないときは WAF も作らない
  UseBackend: !And [!Condition UseCloudFront, !Not [!Equals [!Ref BackendDomainName, ""]]]
  UseWaf: !And [!Equals [!Ref EnableWaf, "true"], !Condition UseCloudFront]
  UsePrTests: !Equals [!Ref EnablePrTests, "true"]
  HasDeployBranch: !Not [!Equals [!Ref DeployBranch, ""]]
  HasDeployPath: !Not [!Equals [!Ref DeployPath, ""]]
  HasSiteBucketName: !Not [!Equals [!Ref SiteBucketName, ""]]

Rules:
  RegionMustBeUsEast1:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: CloudFront 用の ACM 証明書を作るため、us-east-1 にデプロイしてください
  DomainRequiredWithCloudFront:
    RuleCondition: !Equals [!Ref EnableCloudFront, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref DomainName, ""]]
        AssertDescription: EnableCloudFront=true のときは DomainName を指定してください
      - Assert: !Not [!Equals [!Ref HostedZoneId, ""]]
        AssertDescription: EnableCloudFront=true のときは HostedZoneId を指定してください

Resources:
  # ===== 配信 =====
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [HasSiteBucketName, !Ref SiteBucketName, !Ref "AWS::NoValue"]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # このディストリビューションからの読み取りだけを許可する（CloudFront を作らないときは誰にも読ませない）
          - !If
            - UseCloudFront
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "${SiteBucket.Arn}/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
            - !Ref "AWS::NoValue"
          # 一覧の権限がないと S3 は存在しないキーに 403 を返す。404 にして、CloudFront で 403 を 404 ページに
          # 置き換えなくて済むようにする（403 はバックエンドの CSRF の拒否などをそのまま返したいため）。
          # 一覧そのものは、Function が / で終わる URI に index.html を付けるためビューアーからは取得できない
          - !If
            - UseCloudFront
            - Sid: AllowCloudFrontList
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:ListBucket
              Resource: !GetAtt SiteBucket.Arn
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
            - !Ref "AWS::NoValue"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: UseCloudFront
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # Astro は /about/index.html の形で出力するため、/about/ や /about へのリクエストに index.html を補う
  DirectoryIndexFunction:
    Type: AWS::CloudFront::Function
    Condition: UseCloudFront
    Properties:
      Name: !Sub "${AWS::StackName}-directory-index"
      AutoPublish: true
      FunctionConfig:
        Comment: ディレクトリ形式の URI に index.html を補う
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.split('/').pop().indexOf('.') === -1) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  # VPS へ転送するパスから先頭の /apps を取り除く（/apps/<slug>/api/... → /<slug>/api/...）。
  # VPS の nginx は /<slug>/ でバックエンドを振り分け、スラッグも取り除いて /api/... で届ける
  BackendPathFunction:
    Type: AWS::CloudFront::Function
    Condition: UseBackend
    Properties:
      Name: !Sub "${AWS::StackName}-backend-path"
      AutoPublish: true
      FunctionConfig:
        Comment: VPS へ転送するパスの先頭の /apps を取り除く
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.indexOf('/apps/') === 0) {
            request.uri = request.uri.substring('/apps'.length);
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${DomainName} portfolio site"
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: SiteBucketOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            # DeployPath 以下をドメイン直下として配信する
            OriginPath: !If [HasDeployPath, !Sub "/${DeployPath}", !Ref "AWS::NoValue"]
            S3OriginConfig:
              OriginAccessIdentity: ""
          - !If
            - UseBackend
            - Id: BackendOrigin
              DomainName: !Ref BackendDomainName
              CustomOriginConfig:
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
                # プレイリストの作成（最大100曲の検索）が既定の 30 秒で切れないよう上限の 60 秒にする
                OriginReadTimeout: 60
            - !Ref "AWS::NoValue"
        # バックエンドの API・認証は VPS へ転送する（キャッシュしない。Cookie・クエリ・Host 以外のヘッダーを渡す）
        # Host は VPS の名前にして、nginx の server_name と証明書に合わせる
        CacheBehaviors: !If
          - UseBackend
          - - PathPattern: /apps/spotify-billboard-playlist/api/*
              TargetOriginId: BackendOrigin
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
              # マネージドポリシー: CachingDisabled / AllViewerExceptHostHeader / SecurityHeadersPolicy
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
              ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt BackendPathFunction.FunctionMetadata.FunctionARN
            - PathPattern: /apps/spotify-billboard-playlist/auth/*
              TargetOriginId: BackendOrigin
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
              ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt BackendPathFunction.FunctionMetadata.FunctionARN
          - !Ref "AWS::NoValue"
        DefaultCacheBehavior:
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # マネージドポリシー: CachingOptimized / SecurityHeadersPolicy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DirectoryIndexFunction.FunctionMetadata.FunctionARN
        # エラー応答の設定はディストリビューション全体（S3 と VPS の両方）に効く。
        # 存在しないキーは 404（SiteBucketPolicy の ListBucket）で、404 だけを 404 ページにする。
        # それ以外はバックエンドの応答（403 の CSRF の拒否など）をそのまま返し、キャッシュもしない
        CustomErrorResponses:
          - ErrorCode: 400
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 500
            ErrorCachingMinTTL: 0
          - ErrorCode: 502
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        WebACLId: !If [UseWaf, !GetAtt WebAcl.Arn, !Ref "AWS::NoValue"]
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # 大量アクセス（DDoS・クローラー）でそのまま料金が増えないよう、IP ごとにリクエスト数を制限する（任意）
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: UseWaf
    Properties:
      Name: !Sub "${AWS::StackName}-web-acl"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}-web-acl"
      Rules:
        - Name: RateLimitPerIp
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              # 5分間に同じ IP から 1000 リクエストを超えたら遮断する（静的サイトの通常の閲覧では届かない値）
              Limit: 1000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-rate-limit"

  AliasRecordA:
    Type: AWS::Route53::RecordSet
    Condition: UseCloudFront
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront の固定ホストゾーン ID

  AliasRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: UseCloudFront
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ===== CI（CodeBuild: テスト用とデプロイ用の2プロジェクト） =====
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${AWS::StackName}"
      RetentionInDays: 30

  # テスト用（信頼できないコードも動きうる）はデプロイ用とロググループを分け、デプロイのログに書き込めないようにする
  TestLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: UsePrTests
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${AWS::StackName}-test"
      RetentionInDays: 30

  # --- テスト用（プルリクエスト）: ログ出力の権限だけを持ち、デプロイ先には触れない ---
  CodeBuildTestRole:
    Type: AWS::IAM::Role
    Condition: UsePrTests
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            # このアカウントのテスト用プロジェクトからだけ引き受けられるようにする（confused deputy 対策）
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}-test"
      Policies:
        - PolicyName: portfolio-site-test
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteBuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${TestLogGroup.Arn}"

  CodeBuildTestProject:
    Type: AWS::CodeBuild::Project
    Condition: UsePrTests
    Properties:
      Name: !Sub "${AWS::StackName}-test"
      Description: portfolio-site の DeployBranch（未指定なら任意のブランチ）向けのプルリクエストのテスト・lint・ビルド（デプロイしない）
      ServiceRole: !GetAtt CodeBuildTestRole.Arn
      TimeoutInMinutes: 20
      # PR の連続更新などでビルドが並行して増え、料金が膨らむのを防ぐ
      ConcurrentBuildLimit: 1
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        # GitHub の認証情報は事前に CodeBuild へ登録しておく（テンプレートには含めない）
        Type: GITHUB
        Location: !Ref GitHubRepoUrl
        BuildSpec: portfolio-site/buildspec.test.yml
        ReportBuildStatus: true
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref TestLogGroup
      Triggers:
        Webhook: true
        FilterGroups:
          - - Type: EVENT
              Pattern: PULL_REQUEST_CREATED,PULL_REQUEST_UPDATED,PULL_REQUEST_REOPENED
            - Type: FILE_PATH
              Pattern: ^portfolio-site/
            # PR の向き先が DeployBranch のときだけ（未指定なら任意のブランチ向け）。dev 向けの PR で本番のテストを動かさない
            - Type: BASE_REF
              Pattern: !If [HasDeployBranch, !Sub "^refs/heads/${DeployBranch}$", "^refs/heads/"]
            # 公開リポジトリのため、fork から第三者が出した PR のコードを実行しない
            - Type: ACTOR_ACCOUNT_ID
              Pattern: !Sub "^${GitHubActorAccountId}$"

  # --- デプロイ用（DeployBranch への push。未指定なら任意のブランチへの push）---
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            # このアカウントのデプロイ用プロジェクトからだけ引き受けられるようにする（confused deputy 対策）
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}-deploy"
      Policies:
        - PolicyName: portfolio-site-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteBuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${BuildLogGroup.Arn}"
              # DeployPath を指定したら、一覧・読み書き・削除はそのパス以下に限る
              - Sid: ListSiteBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
                Condition: !If
                  - HasDeployPath
                  - StringLike:
                      s3:prefix:
                        - !Sub "${DeployPath}/*"
                  - !Ref "AWS::NoValue"
              - Sid: SyncSiteObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !If
                  - HasDeployPath
                  - !Sub "${SiteBucket.Arn}/${DeployPath}/*"
                  - !Sub "${SiteBucket.Arn}/*"
              - !If
                - UseCloudFront
                - Sid: InvalidateCache
                  Effect: Allow
                  Action: cloudfront:CreateInvalidation
                  Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
                - !Ref "AWS::NoValue"
              # 定期実行で作った IT 記事・セキュリティ記事を取り込んでからビルドする（buildspec.yml の pre_build）。読み取りだけ
              - Sid: ListItArticles
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ItArticlesBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - it-articles/*
                      - security-articles/*
              - Sid: ReadItArticles
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "${ItArticlesBucket.Arn}/it-articles/*"
                  - !Sub "${ItArticlesBucket.Arn}/security-articles/*"

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-deploy"
      Description: portfolio-site の DeployBranch（未指定なら任意のブランチ）への push 時のテスト・lint・ビルドとデプロイ
      ServiceRole: !GetAtt CodeBuildRole.Arn
      TimeoutInMinutes: 20
      # デプロイ（s3 sync）が並行して走り、古い成果物で上書きされるのを防ぐ
      ConcurrentBuildLimit: 1
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        # GitHub の認証情報は事前に CodeBuild へ登録しておく（テンプレートには含めない）
        Type: GITHUB
        Location: !Ref GitHubRepoUrl
        BuildSpec: portfolio-site/buildspec.yml
        ReportBuildStatus: true
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: SITE_BUCKET
            Value: !Ref SiteBucket
          # CloudFront を作らないときは空にする（buildspec.yml はキャッシュ無効化を省略する）
          - Name: DISTRIBUTION_ID
            Value: !If [UseCloudFront, !Ref Distribution, ""]
          - Name: DEPLOY_PATH
            Value: !Ref DeployPath
          - Name: DEPLOY_BRANCH
            Value: !Ref DeployBranch
          - Name: IT_ARTICLES_BUCKET
            Value: !Ref ItArticlesBucket
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
      Triggers:
        Webhook: true
        FilterGroups:
          # デプロイ対象ブランチへの push だけ（DeployBranch 未指定なら任意のブランチ。プルリクエストは CodeBuildTestProject）
          - - Type: EVENT
              Pattern: PUSH
            - Type: HEAD_REF
              Pattern: !If [HasDeployBranch, !Sub "^refs/heads/${DeployBranch}$", "^refs/heads/"]
            - Type: FILE_PATH
              Pattern: ^portfolio-site/

  # ===== IT 記事の定期作成（EventBridge Scheduler → CodeBuild → Perplexity） =====
  # 記事の md の保存先（正本）。ビルドのたびに src/content/it-articles/ に取り込む
  ItArticlesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # 誤って上書き・削除した記事を戻せるようにする
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90

  ItArticlesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ItArticlesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ItArticlesBucket.Arn
              - !Sub "${ItArticlesBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ItArticlesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${AWS::StackName}-it-articles"
      RetentionInDays: 30

  # 記事の作成とデプロイ。配信用バケットのオブジェクトは削除できない（apps/ をビルドしないため、差分デプロイは削除しない）
  ItArticlesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            # このアカウントの IT 記事用プロジェクトからだけ引き受けられるようにする（confused deputy 対策）
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}-it-articles"
      Policies:
        - PolicyName: portfolio-site-it-articles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteBuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${ItArticlesLogGroup.Arn}"
              - Sid: ReadApiKey
                Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PerplexityApiKeyParameterName}"
              - Sid: ListItArticles
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ItArticlesBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - it-articles/*
                      - security-articles/*
              - Sid: ReadWriteItArticles
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub "${ItArticlesBucket.Arn}/it-articles/*"
                  - !Sub "${ItArticlesBucket.Arn}/security-articles/*"
              # 差分デプロイ（deploy_diff.py）: 一覧と ETag の取得・アップロードだけ。DeployPath を指定したらそのパス以下に限る
              - Sid: ListSiteBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
                Condition: !If
                  - HasDeployPath
                  - StringLike:
                      s3:prefix:
                        - !Sub "${DeployPath}/*"
                  - !Ref "AWS::NoValue"
              - Sid: UploadSiteObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !If
                  - HasDeployPath
                  - !Sub "${SiteBucket.Arn}/${DeployPath}/*"
                  - !Sub "${SiteBucket.Arn}/*"
              - !If
                - UseCloudFront
                - Sid: InvalidateCache
                  Effect: Allow
                  Action: cloudfront:CreateInvalidation
                  Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
                - !Ref "AWS::NoValue"

  ItArticlesProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-it-articles"
      Description: IT 記事・セキュリティ記事の定期作成（Perplexity で作成 → サイト全体をビルド → 記事を S3 に保存 → MD5 の差分だけデプロイ）
      ServiceRole: !GetAtt ItArticlesRole.Arn
      TimeoutInMinutes: 30
      # 定期実行が重なって同じ題材の記事を二重に作らないようにする
      ConcurrentBuildLimit: 1
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        # GitHub の認証情報は事前に CodeBuild へ登録しておく（テンプレートには含めない）
        Type: GITHUB
        Location: !Ref GitHubRepoUrl
        BuildSpec: portfolio-site/buildspec.it-articles.yml
        ReportBuildStatus: false
      # DeployBranch のコードでビルドする（未指定ならリポジトリのデフォルトブランチ）
      SourceVersion: !If [HasDeployBranch, !Ref DeployBranch, !Ref "AWS::NoValue"]
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: SITE_BUCKET
            Value: !Ref SiteBucket
          - Name: DISTRIBUTION_ID
            Value: !If [UseCloudFront, !Ref Distribution, ""]
          - Name: DEPLOY_PATH
            Value: !Ref DeployPath
          - Name: IT_ARTICLES_BUCKET
            Value: !Ref ItArticlesBucket
          - Name: IT_ARTICLES_PER_RUN
            Value: !Ref ItArticlesPerRun
          - Name: SECURITY_ARTICLES_PER_RUN
            Value: !Ref SecurityArticlesPerRun
          - Name: PERPLEXITY_MODEL
            Value: !Ref PerplexityModel
          # API キーは SSM から実行時に読み込む（値はテンプレート・ログに出ない）
          - Name: PERPLEXITY_API_KEY
            Type: PARAMETER_STORE
            Value: !Ref PerplexityApiKeyParameterName
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref ItArticlesLogGroup

  ItArticlesSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: start-it-articles-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StartItArticlesBuild
                Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt ItArticlesProject.Arn

  ItArticlesSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-it-articles"
      Description: IT 記事の定期作成（CodeBuild の StartBuild）
      ScheduleExpression: !Ref ItArticlesScheduleExpression
      ScheduleExpressionTimezone: Asia/Tokyo
      FlexibleTimeWindow:
        Mode: "OFF"
      # DeployBranch が空だと push のデプロイは任意のブランチを公開し、定期実行はデフォルトブランチを公開して食い違うため、常に OFF にする
      State: !If [HasDeployBranch, !Ref ItArticlesScheduleState, DISABLED]
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:codebuild:startBuild
        RoleArn: !GetAtt ItArticlesSchedulerRole.Arn
        Input: !Sub '{"ProjectName": "${ItArticlesProject}"}'
        RetryPolicy:
          MaximumRetryAttempts: 0

  # ===== 料金 =====
  # 料金の上限は無いため、予算を超えそうになったらメールで気づけるようにする
  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

Outputs:
  SiteUrl:
    Condition: UseCloudFront
    Description: サイトの URL
    Value: !Sub "https://${DomainName}/"
  AppsBaseUrl:
    Condition: UseCloudFront
    Description: ポートフォリオのフロントエンド（apps/apps.json に登録したもの）の配信先。各アプリは <この URL><スラッグ>/
    Value: !Sub "https://${DomainName}/apps/"
  BucketName:
    Description: サイトのファイルを置く S3 バケット
    Value: !Ref SiteBucket
  DeployUri:
    Description: ビルド成果物のアップロード先
    Value: !If [HasDeployPath, !Sub "s3://${SiteBucket}/${DeployPath}/", !Sub "s3://${SiteBucket}/"]
  ItArticlesBucketName:
    Description: IT 記事（md）の保存先の S3 バケット（記事は it-articles/ 以下）
    Value: !Ref ItArticlesBucket
  ItArticlesProjectName:
    Description: IT 記事の定期作成の CodeBuild プロジェクト（手動で実行するときは aws codebuild start-build --project-name <この値>）
    Value: !Ref ItArticlesProject
  DistributionId:
    Condition: UseCloudFront
    Description: CloudFront ディストリビューション ID
    Value: !Ref Distribution
