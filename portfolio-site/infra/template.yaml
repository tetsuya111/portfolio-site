AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ポートフォリオサイト（portfolio-site/）の配信基盤と CI。
  S3（非公開）+ CloudFront（OAC）+ ACM + Route 53 + CodeBuild（GitHub Webhook。PR はテスト用、push はデプロイ用）。
  CloudFront で使う ACM 証明書は us-east-1 にしか作れないため、このスタックは us-east-1 にデプロイする。

Parameters:
  DomainName:
    Type: String
    Description: サイトのドメイン名（例 portfolio.example.com）。HostedZoneId のゾーン内の名前にする
    AllowedPattern: "^(?!-)[a-z0-9-]+(\\.[a-z0-9-]+)+$"
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: DomainName を管理している作成済みの Route 53 ホストゾーン
  GitHubRepoUrl:
    Type: String
    Description: GitHub リポジトリの HTTPS URL（例 https://github.com/owner/repo.git）。CodeBuild に GitHub の認証情報を事前登録しておく
    AllowedPattern: "^https://github\\.com/[^/]+/[^/]+$"
  DeployBranch:
    Type: String
    Default: main
    Description: push されたときに本番へデプロイするブランチ

Rules:
  RegionMustBeUsEast1:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: CloudFront 用の ACM 証明書を作るため、us-east-1 にデプロイしてください

Resources:
  # ===== 配信 =====
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # このディストリビューションからの読み取りだけを許可する
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # Astro は /about/index.html の形で出力するため、/about/ や /about へのリクエストに index.html を補う
  DirectoryIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-directory-index"
      AutoPublish: true
      FunctionConfig:
        Comment: ディレクトリ形式の URI に index.html を補う
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.split('/').pop().indexOf('.') === -1) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${DomainName} portfolio site"
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: SiteBucketOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # マネージドポリシー: CachingOptimized / SecurityHeadersPolicy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DirectoryIndexFunction.FunctionMetadata.FunctionARN
        # 存在しないキーは OAC 経由だと 403 になるため、どちらも 404 ページを返す
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  AliasRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront の固定ホストゾーン ID

  AliasRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ===== CI（CodeBuild: テスト用とデプロイ用の2プロジェクト） =====
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${AWS::StackName}"
      RetentionInDays: 30

  # --- テスト用（プルリクエスト）: ログ出力の権限だけを持ち、デプロイ先には触れない ---
  CodeBuildTestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: portfolio-site-test
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteBuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${BuildLogGroup.Arn}"

  CodeBuildTestProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-test"
      Description: portfolio-site のプルリクエストのテスト・lint・ビルド（デプロイしない）
      ServiceRole: !GetAtt CodeBuildTestRole.Arn
      TimeoutInMinutes: 20
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        # GitHub の認証情報は事前に CodeBuild へ登録しておく（テンプレートには含めない）
        Type: GITHUB
        Location: !Ref GitHubRepoUrl
        BuildSpec: portfolio-site/buildspec.test.yml
        ReportBuildStatus: true
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
      Triggers:
        Webhook: true
        FilterGroups:
          - - Type: EVENT
              Pattern: PULL_REQUEST_CREATED,PULL_REQUEST_UPDATED,PULL_REQUEST_REOPENED
            - Type: FILE_PATH
              Pattern: ^portfolio-site/

  # --- デプロイ用（DeployBranch への push）---
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: portfolio-site-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteBuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${BuildLogGroup.Arn}"
              - Sid: ListSiteBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Sid: SyncSiteObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Sid: InvalidateCache
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-deploy"
      Description: portfolio-site の DeployBranch への push 時のテスト・lint・ビルドとデプロイ
      ServiceRole: !GetAtt CodeBuildRole.Arn
      TimeoutInMinutes: 20
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        # GitHub の認証情報は事前に CodeBuild へ登録しておく（テンプレートには含めない）
        Type: GITHUB
        Location: !Ref GitHubRepoUrl
        BuildSpec: portfolio-site/buildspec.yml
        ReportBuildStatus: true
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: SITE_BUCKET
            Value: !Ref SiteBucket
          - Name: DISTRIBUTION_ID
            Value: !Ref Distribution
          - Name: DEPLOY_BRANCH
            Value: !Ref DeployBranch
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
      Triggers:
        Webhook: true
        FilterGroups:
          # デプロイ対象ブランチへの push だけ（プルリクエストは CodeBuildTestProject）
          - - Type: EVENT
              Pattern: PUSH
            - Type: HEAD_REF
              Pattern: !Sub "^refs/heads/${DeployBranch}$"
            - Type: FILE_PATH
              Pattern: ^portfolio-site/

Outputs:
  SiteUrl:
    Description: サイトの URL
    Value: !Sub "https://${DomainName}/"
  BucketName:
    Description: サイトのファイルを置く S3 バケット
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront ディストリビューション ID
    Value: !Ref Distribution
