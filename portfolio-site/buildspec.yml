# CodeBuild 用・デプロイ（infra/template.yaml の CodeBuildProject から参照）
# DEPLOY_BRANCH への push で実行し、テスト・lint・ビルドが成功したときだけデプロイする。
# プルリクエストはテスト専用の buildspec.test.yml（権限の小さい別プロジェクト）で実行する。
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - cd portfolio-site
      # 依存のインストールスクリプト（postinstall など）は実行しない。デプロイ用の権限があるビルドで、
      # 乗っ取られた依存のスクリプトが動かないようにするため（esbuild のバイナリは optionalDependencies で入る）
      - npm ci --ignore-scripts
  build:
    commands:
      - npm test
      - npm run lint
      # astro build と、成果物に管理画面が含まれないことなどの検証
      - npm run test:build
      # apps/apps.json に登録したポートフォリオのフロントエンドを dist/apps/<スラッグ>/ にビルドする
      - npm run build:apps
  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ] && [ "$CODEBUILD_WEBHOOK_EVENT" = "PUSH" ] && [ "$CODEBUILD_WEBHOOK_HEAD_REF" = "refs/heads/$DEPLOY_BRANCH" ]; then
          aws s3 sync dist "s3://$SITE_BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
        else
          echo "デプロイ対象のビルドではないため、デプロイを省略します"
        fi
