# CodeBuild 用・IT 記事の定期作成（infra/template.yaml の ItArticlesProject から参照。EventBridge Scheduler が起動する）
# 1. S3 に保存済みの過去の記事を src/content/it-articles/・src/content/security-articles/ に取り込む
# 2. 汎用バッチ（portfolios/batch/）で新しい IT 記事・セキュリティ記事を Perplexity で作り、同じフォルダに md で置く
# 3. サイト全体をビルドし、成功したときだけ記事を S3 に保存して、内容（MD5）が変わったファイルだけを配信用バケットに送る
# apps/ はビルドしないため、配信用バケットのファイルは削除しない（掃除は push 時の buildspec.yml の s3 sync --delete に任せる）
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
      python: 3.12
    commands:
      - cd portfolio-site
      # デプロイ用の権限があるビルドのため、依存のインストールスクリプトは実行しない（buildspec.yml と同じ）
      - npm ci --ignore-scripts
      # 差分デプロイ（deploy_diff.py）だけが使う。バージョンを固定する
      - python -m pip install --no-cache-dir --disable-pip-version-check "boto3==1.35.0"
  pre_build:
    commands:
      - test -n "$IT_ARTICLES_BUCKET"
      - aws s3 sync "s3://$IT_ARTICLES_BUCKET/it-articles/" src/content/it-articles/ --exclude "*" --include "*.md"
      - aws s3 sync "s3://$IT_ARTICLES_BUCKET/security-articles/" src/content/security-articles/ --exclude "*" --include "*.md"
  build:
    commands:
      # PERPLEXITY_API_KEY（SSM Parameter Store から）・PERPLEXITY_MODEL・IT_ARTICLES_PER_RUN はプロジェクトの環境変数
      - python ../portfolios/batch/generate_it_articles.py --out-dir src/content/it-articles
      # セキュリティ記事（SECURITY_ARTICLES_PER_RUN が 0 なら作らない）。失敗しても IT 記事の公開は続ける
      - |
        if [ "${SECURITY_ARTICLES_PER_RUN:-3}" -gt 0 ]; then
          python ../portfolios/batch/generate_security_articles.py --out-dir src/content/security-articles || echo "セキュリティ記事を作成できませんでした（IT 記事の公開は続けます）"
        else
          echo "SECURITY_ARTICLES_PER_RUN が 0 のため、セキュリティ記事の作成を省略します"
        fi
      # push のデプロイ（buildspec.yml）と同じく、テストと lint に通ったコードだけを公開する
      - npm test
      - npm run lint
      # astro build と成果物の検証。記事の md がスキーマを満たさなければここで失敗し、保存も公開もしない
      - npm run test:build
  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
          # 記事の保存に失敗したら公開しない（保存されていない記事のページは、次の push のデプロイで消えてしまう）
          set -e
          aws s3 sync src/content/it-articles/ "s3://$IT_ARTICLES_BUCKET/it-articles/" --exclude "*" --include "*.md"
          aws s3 sync src/content/security-articles/ "s3://$IT_ARTICLES_BUCKET/security-articles/" --exclude "*" --include "*.md"
          DIST_DIR=dist BUCKET="$SITE_BUCKET" PREFIX="$DEPLOY_PATH" DISTRIBUTION_ID="$DISTRIBUTION_ID" python ../portfolios/batch/deploy_diff.py
        else
          echo "ビルドが失敗したため、記事の保存とデプロイを省略します"
        fi
